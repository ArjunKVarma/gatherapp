{% extends "gather/layout.html" %}
{% load static %}

{% block title %}Login{% endblock %}

{% block body %}
<section class="hero-section" style="padding: 100px 0; min-height: 80vh; display: flex; align-items: center;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="m3-card border-0 shadow-lg overflow-hidden">
                    <div class="row g-0">
                        <!-- Image Side -->
                        <div class="col-lg-6 d-none d-lg-block">
                            <div class="h-100" style="background: url('{% static 'gather/images/rw.png' %}') center/cover no-repeat; min-height: 500px;">
                                <div class="h-100 w-100" style="background: rgba(0, 82, 204, 0.4); backdrop-filter: grayscale(0.5);"></div>
                            </div>
                        </div>
                        <!-- Form Side -->
                        <div class="col-lg-6 p-5 bg-white d-flex flex-column justify-content-center" data-aos="fade-left">
                            <h2 class="mb-2 text-uppercase" style="letter-spacing: 2px;">Welcome Back</h2>
                            <p class="text-muted mb-4">Adventure is waiting for you. Log in to continue.</p>
                            
                            {% if message %}
                            <div class="{{ msg_class|default:'m3-alert' }} mb-4">
                                <i class="fa fa-info-circle me-2"></i> {{ message }}
                            </div>
                            {% endif %}
                            <form id="loginForm" action="{% url 'login' %}" method="post">
                                {% csrf_token %}
                                
                                <div class="m3-field mb-4">
                                    <label class="small fw-bold text-primary mb-2 d-block">USERNAME</label>
                                    <input type="text" class="m3-input" name="username" placeholder="Your username" required>
                                </div>
                                
                                <div class="m3-field mb-5">
                                    <label class="small fw-bold text-primary mb-2 d-block">PASSWORD</label>
                                    <input type="password" class="m3-input" name="password" placeholder="••••••••" required>
                                </div>
                                
                                <button class="m3-btn m3-btn-primary w-100 py-3 mb-4" type="submit">
                                    LOGIN TO GATHER
                                </button>
                                
                                <p class="text-center mb-0 small fw-bold">
                                    NEW TO GATHER? <a href="{% url 'register' %}" class="text-primary border-bottom border-primary">CREATE ACCOUNT</a>
                                </p>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
