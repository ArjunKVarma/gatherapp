{% extends "gather/layout.html" %}
{% load static %}

{% block title %}Register{% endblock %}

{% block body %}
<section class="hero-section" style="padding: 100px 0; min-height: 80vh; display: flex; align-items: center;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="m3-card border-0 shadow-lg overflow-hidden">
                    <div class="row g-0">
                        <!-- Form Side -->
                        <div class="col-lg-6 p-5 bg-white d-flex flex-column justify-content-center order-2 order-lg-1"
                            data-aos="fade-right">
                            <h2 class="mb-2 text-uppercase" style="letter-spacing: 2px;">Join Gather</h2>
                            <p class="text-muted mb-4">Register now to discover.</p>

                            <form id="registerForm" action="{% url 'register' %}" method="post">
                                {% csrf_token %}

                                <div class="m3-field mb-4">
                                    <label class="small fw-bold text-primary mb-2 d-block">USERNAME</label>
                                    <input type="text" class="m3-input" name="username" placeholder="Choose a username"
                                        required>
                                </div>

                                <div class="m3-field mb-4">
                                    <label class="small fw-bold text-primary mb-2 d-block">CHOOSE YOUR PATH</label>
                                    <div class="row g-3">
                                        <div class="col-6">
                                            <label class="w-100">
                                                <input type="radio" name="role" value="user" checked class="role-radio d-none">
                                                <div class="role-option-card p-3 text-center">
                                                    <i class="fa fa-compass mb-2 d-block fa-lg"></i>
                                                    <span class="small fw-bold">EXPLORER</span>
                                                </div>
                                            </label>
                                        </div>
                                        <div class="col-6">
                                            <label class="w-100">
                                                <input type="radio" name="role" value="editor" class="role-radio d-none">
                                                <div class="role-option-card p-3 text-center">
                                                    <i class="fa fa-plus-square mb-2 d-block fa-lg"></i>
                                                    <span class="small fw-bold">CREATOR</span>
                                                </div>
                                            </label>
                                        </div>
                                    </div>
                                </div>

                                <div class="m3-field mb-5">
                                    <label class="small fw-bold text-primary mb-2 d-block">PASSWORD</label>
                                    <input type="password" class="m3-input" name="password"
                                        placeholder="Create a password" required>
                                </div>


                                <button class="m3-btn m3-btn-primary w-100 py-3 mb-4" type="submit">
                                    START EXPLORING
                                </button>

                                <p class="text-center mb-0 small fw-bold">
                                    ALREADY A MEMBER? <a href="{% url 'login' %}"
                                        class="text-primary border-bottom border-primary">SIGN IN</a>
                                </p>
                            </form>
                        </div>
                        <!-- Image Side -->
                        <div class="col-lg-6 d-none d-lg-block order-1 order-lg-2">
                            <div class="h-100"
                                style="background: url('{% static 'gather/images/rw.png' %}') center/cover no-repeat; min-height: 500px;">
                                <div class="h-100 w-100"
                                    style="background: rgba(40, 167, 69, 0.4); backdrop-filter: grayscale(0.5);"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
